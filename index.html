<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Avatar Downloader v3</title>
  <style>
    :root {
      --bg-color: #0f0f0f;
      --card-bg: #1f1f1f;
      --accent-color: #ff0000;
      --text-color: #ffffff;
      --subtext-color: #aaaaaa;
      --border-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 28px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 20px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--subtext-color);
      margin-bottom: 6px;
    }

    input[type="text"], 
    input[type="number"], 
    select {
      width: 100%;
      padding: 10px 12px;
      background-color: #121212;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-color);
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent-color);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: var(--accent-color);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #cc0000;
    }

    button:disabled {
      background-color: #555555;
      cursor: not-allowed;
    }

    .status {
      font-size: 0.85rem;
      margin-top: 12px;
      text-align: center;
      min-height: 20px;
      color: #ffb700;
      word-break: break-word;
    }

    .error {
      color: #ff4d4d;
    }

    .success {
      color: #2ec4b6;
    }

    .preview-container {
      margin-top: 20px;
      text-align: center;
      display: none;
      border-top: 1px solid var(--border-color);
      padding-top: 20px;
    }

    .preview-img {
      max-width: 180px;
      max-height: 180px;
      border-radius: 50%;
      border: 2px solid var(--border-color);
      margin-bottom: 16px;
      object-fit: cover;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>Descargar Foto de Canal YT</h1>

  <div class="form-group">
    <label for="yt-url">Enlace del Canal de YouTube o Handle (@canal):</label>
    <input type="text" id="yt-url" placeholder="https://www.youtube.com/@nombre_canal o @nombre_canal">
  </div>

  <button id="btn-fetch" onclick="buscarImagen()">Buscar Foto</button>

  <div id="status" class="status"></div>

  <div id="controls" class="preview-container">
    <img id="img-preview" class="preview-img" alt="Vista previa">

    <div class="grid-2 form-group">
      <div>
        <label for="img-width">Ancho (px):</label>
        <input type="number" id="img-width" value="512" min="16" max="4096">
      </div>
      <div>
        <label for="img-height">Alto (px):</label>
        <input type="number" id="img-height" value="512" min="16" max="4096">
      </div>
    </div>

    <div class="form-group">
      <label for="img-format">Formato de Descarga:</label>
      <select id="img-format">
        <option value="png">PNG (Transparencia)</option>
        <option value="jpeg">JPG / JPEG</option>
        <option value="webp">WebP (Optimizado)</option>
      </select>
    </div>

    <button onclick="descargarImagen()">Descargar Imagen</button>
  </div>
</div>

<script>
  let avatarLoadedUrl = '';

  // Lista de APIs públicas con CORS habilitado
  const API_ENDPOINTS = [
    {
      name: 'Invidious (Node 1)',
      fetchAvatar: async (id) => {
        const res = await fetch(`https://inv.tux.pizza/api/v1/channels/${id}`);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (data.authorThumbnails && data.authorThumbnails.length > 0) {
          return data.authorThumbnails[data.authorThumbnails.length - 1].url;
        }
        throw new Error('Sin imagen en este nodo.');
      }
    },
    {
      name: 'Invidious (Node 2)',
      fetchAvatar: async (id) => {
        const res = await fetch(`https://invidious.nerdvpn.de/api/v1/channels/${id}`);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (data.authorThumbnails && data.authorThumbnails.length > 0) {
          return data.authorThumbnails[data.authorThumbnails.length - 1].url;
        }
        throw new Error('Sin imagen en este nodo.');
      }
    },
    {
      name: 'Piped API',
      fetchAvatar: async (id) => {
        const res = await fetch(`https://pipedapi.kavin.rocks/channel/${id}`);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (data.avatarUrl) return data.avatarUrl;
        throw new Error('Sin avatar en Piped.');
      }
    }
  ];

  function extraerIdentificador(input) {
    input = input.trim();

    // Si pegan directamente una URL de imagen de Google/YouTube
    if (input.includes('ggpht.com') || input.includes('googleusercontent.com')) {
      return { type: 'image_url', value: input };
    }

    // Extraer @handle
    const handleMatch = input.match(/(?:youtube\.com\/)?(@[\w.-]+)/i);
    if (handleMatch) return { type: 'api_id', value: handleMatch[1] };

    // Extraer Channel ID (UC...)
    const channelMatch = input.match(/youtube\.com\/channel\/(UC[\w-]+)/i);
    if (channelMatch) return { type: 'api_id', value: channelMatch[1] };

    // Extraer nombre de canal personalizado
    const customMatch = input.match(/youtube\.com\/c\/([\w.-]+)/i) || input.match(/youtube\.com\/user\/([\w.-]+)/i);
    if (customMatch) return { type: 'api_id', value: customMatch[1] };

    // Si el texto no es una URL completa, asumirlo como ID o Handle
    if (!input.includes('http')) {
      return { type: 'api_id', value: input.startsWith('@') ? input : '@' + input };
    }

    return { type: 'unknown', value: input };
  }

  function optimizarResolucion(url) {
    // Si la URL es relativa de Invidious, convertir a absoluta
    if (url.startsWith('//')) url = 'https:' + url;
    
    // Reemplazar parámetro de calidad por 2048px (Máxima resolución original)
    if (url.includes('=s')) {
      return url.replace(/=s\d+[^"]*/, '=s2048-c-k-c0x00ffffff-no-rj');
    }
    return url;
  }

  async function buscarImagen() {
    const rawInput = document.getElementById('yt-url').value;
    const status = document.getElementById('status');
    const controls = document.getElementById('controls');
    const btnFetch = document.getElementById('btn-fetch');

    if (!rawInput.trim()) {
      status.textContent = 'Ingresa un enlace o handle del canal.';
      status.className = 'status error';
      return;
    }

    status.textContent = 'Procesando...';
    status.className = 'status';
    btnFetch.disabled = true;
    controls.style.display = 'none';

    const parsed = extraerIdentificador(rawInput);

    try {
      let finalImgUrl = '';

      if (parsed.type === 'image_url') {
        finalImgUrl = parsed.value;
      } else if (parsed.type === 'api_id') {
        let obtenido = false;

        for (const api of API_ENDPOINTS) {
          try {
            status.textContent = `Consultando canal (${api.name})...`;
            const rawUrl = await api.fetchAvatar(parsed.value);
            if (rawUrl) {
              finalImgUrl = rawUrl;
              obtenido = true;
              break;
            }
          } catch (e) {
            console.warn(`Falló la consulta en ${api.name}`, e);
          }
        }

        if (!obtenido) {
          throw new Error('No se pudo encontrar el avatar. Verifica que el nombre o enlace del canal sea correcto.');
        }
      } else {
        throw new Error('Formato de URL no reconocido. Intenta usando el handle directamente, por ejemplo: @NombreDeCanal');
      }

      avatarLoadedUrl = optimizarResolucion(finalImgUrl);

      // Cargar en la vista previa
      const imgPreview = document.getElementById('img-preview');
      imgPreview.crossOrigin = "anonymous";
      imgPreview.src = avatarLoadedUrl;

      imgPreview.onload = () => {
        status.textContent = '¡Imagen obtenida exitosamente!';
        status.className = 'status success';
        controls.style.display = 'block';
        btnFetch.disabled = false;
      };

      imgPreview.onerror = () => {
        // En caso de que falle por política de origen de la imagen, usar fallback directo
        imgPreview.removeAttribute('crossOrigin');
        imgPreview.src = avatarLoadedUrl;
        status.textContent = '¡Imagen obtenida!';
        status.className = 'status success';
        controls.style.display = 'block';
        btnFetch.disabled = false;
      };

    } catch (err) {
      status.textContent = err.message || 'Error al obtener la imagen.';
      status.className = 'status error';
      btnFetch.disabled = false;
    }
  }

  function descargarImagen() {
    if (!avatarLoadedUrl) return;

    const width = parseInt(document.getElementById('img-width').value) || 512;
    const height = parseInt(document.getElementById('img-height').value) || 512;
    const format = document.getElementById('img-format').value;

    const img = new Image();
    img.crossOrigin = "anonymous";
    img.src = avatarLoadedUrl;

    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;

      const ctx = canvas.getContext('2d');

      // Si es JPG, añadir fondo blanco para evitar transparencias negras
      if (format === 'jpeg') {
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, width, height);
      }

      ctx.drawImage(img, 0, 0, width, height);

      const mimeType = `image/${format}`;
      const dataUrl = canvas.toDataURL(mimeType, 0.95);

      const link = document.createElement('a');
      link.download = `youtube_avatar_${width}x${height}.${format === 'jpeg' ? 'jpg' : format}`;
      link.href = dataUrl;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    };

    img.onerror = () => {
      alert('Hubo un problema al procesar la imagen para su redimensionamiento.');
    };
  }
</script>

</body>
</html>
